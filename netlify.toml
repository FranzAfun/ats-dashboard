# Netlify deployment configuration (08_ATS_FULL_DEVELOPMENT_PLAN.md, Phase 11).
#
# Data source: builds default to the LIVE adapter, which is not implemented
# yet (transport TBD), so a default deploy shows "not configured" states.
# For a demo deploy with mock data, set VITE_DATA_SOURCE=mock in the Netlify
# site environment. Never put secrets in VITE_* variables: they are public.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page application: serve index.html for client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # connect-src must be extended with the confirmed integration endpoint
    # once the live transport is known (07_INTEGRATION_PLAN.md).
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
